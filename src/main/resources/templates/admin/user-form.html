<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add User - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
<nav class="bg-rose-600 text-white p-6">
    <div class="max-w-7xl mx-auto flex justify-between">
        <h1 class="text-3xl font-bold">Add User</h1>
        <a href="/admin/users" class="hover:underline">← Back to Users</a>
    </div>
</nav>

<div class="max-w-3xl mx-auto p-8">
    <div th:if="${error}" class="bg-red-100 text-red-700 p-4 rounded mb-6" th:text="${error}"></div>

    <form th:action="@{/admin/users}" method="post" class="bg-white rounded-xl shadow-xl p-8 space-y-6">
        <div>
            <label class="block font-semibold text-gray-700 mb-2">Name</label>
            <input type="text" name="name" required
                   class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-rose-400">
        </div>

        <div>
            <label class="block font-semibold text-gray-700 mb-2">Email</label>
            <input type="email" name="email" required
                   class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-rose-400">
        </div>

        <div>
            <label class="block font-semibold text-gray-700 mb-2">Password</label>
            <input type="password" name="password" required minlength="4"
                   class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-rose-400">
        </div>

        <div>
            <label class="block font-semibold text-gray-700 mb-2">Role</label>
            <select name="role" required
                    class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-rose-400">
                <option th:each="role : ${roles}" th:value="${role}" th:text="${role}">DOCTOR</option>
            </select>
            <p class="text-sm text-gray-500 mt-2">
                Patient users get a basic patient profile automatically.
            </p>
        </div>

        <div class="flex gap-4">
            <button type="submit"
                    class="bg-rose-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-rose-700">
                Create User
            </button>
            <a href="/admin/users"
               class="bg-gray-200 text-gray-700 px-6 py-3 rounded-lg font-semibold hover:bg-gray-300">
                Cancel
            </a>
        </div>
    </form>
</div>
</body>
</html>
