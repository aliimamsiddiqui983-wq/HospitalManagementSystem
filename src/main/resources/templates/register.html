<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - MediCore HMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="min-h-screen">
<main class="min-h-screen flex items-center justify-center p-6">
    <div class="grid lg:grid-cols-[0.9fr_1.1fr] gap-8 max-w-6xl w-full items-center">
        <section class="glass rounded-[2rem] p-8 lg:p-10">
            <div class="h-14 w-14 rounded-2xl bg-teal-500 text-white grid place-items-center shadow-xl">
                <i class="fa-solid fa-notes-medical text-2xl"></i>
            </div>
            <h1 class="text-4xl font-black mt-6 leading-tight">Create your patient profile in minutes.</h1>
            <p class="text-slate-600 mt-4">
                Book visits, track appointments, and keep your hospital interactions organized from one secure portal.
            </p>
            <div class="grid sm:grid-cols-2 gap-4 mt-8">
                <div class="rounded-2xl bg-white/70 p-5 border border-white">
                    <i class="fa-solid fa-calendar-check text-blue-600"></i>
                    <p class="font-bold mt-3">Fast booking</p>
                    <p class="text-sm text-slate-500">Choose doctor, date, and time.</p>
                </div>
                <div class="rounded-2xl bg-white/70 p-5 border border-white">
                    <i class="fa-solid fa-lock text-teal-600"></i>
                    <p class="font-bold mt-3">Secure access</p>
                    <p class="text-sm text-slate-500">Protected by Spring Security.</p>
                </div>
            </div>
        </section>

        <section class="card p-8">
            <div class="flex items-center justify-between mb-8">
                <div>
                    <p class="text-sm font-bold text-blue-600">PATIENT ONBOARDING</p>
                    <h2 class="text-3xl font-black">Register</h2>
                </div>
                <a href="/login" class="btn btn-soft">Login</a>
            </div>

            <div th:if="${error}" class="mb-5 rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700" th:text="${error}"></div>

            <form th:action="@{/register}" th:object="${patient}" method="post" class="grid sm:grid-cols-2 gap-5">
                <div class="sm:col-span-2">
                    <label class="block text-sm font-bold text-slate-700 mb-2">Full name</label>
                    <input class="input" type="text" th:field="*{name}" required placeholder="Your full name">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Email</label>
                    <input class="input" type="email" th:field="*{email}" required placeholder="you@example.com">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Phone</label>
                    <input class="input" type="text" th:field="*{phone}" placeholder="+91 98765 43210">
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-sm font-bold text-slate-700 mb-2">Password</label>
                    <input class="input" type="password" name="password" required minlength="6" placeholder="Minimum 6 characters">
                </div>
                <div class="sm:col-span-2">
                    <button type="submit" class="btn btn-primary w-full">
                        <i class="fa-solid fa-user-plus"></i> Create patient account
                    </button>
                </div>
            </form>
        </section>
    </div>
</main>
</body>
</html>
