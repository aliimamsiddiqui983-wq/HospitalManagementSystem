spring.application.name=hospital
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hospital_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=${SPRING_JPA_OPEN_IN_VIEW:false}
spring.jpa.properties.hibernate.format_sql=true
server.port=${SERVER_PORT:8080}
spring.thymeleaf.cache=${SPRING_THYMELEAF_CACHE:false}

# ===================================
# Logging (Optional - nice to see SQL)
# ===================================
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:INFO}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${HIBERNATE_BINDER_LOG_LEVEL:INFO}

# ===================================
# Demo accounts seeded on startup
# ===================================
app.seed.enabled=${APP_SEED_ENABLED:true}
app.seed.admin.email=${APP_SEED_ADMIN_EMAIL:admin@hospital.com}
app.seed.admin.password=${APP_SEED_ADMIN_PASSWORD:password}
app.seed.doctor.email=${APP_SEED_DOCTOR_EMAIL:sarah@hospital.com}
app.seed.doctor.password=${APP_SEED_DOCTOR_PASSWORD:password}
